<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Smart Grid Energy Load Balancing System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(0, 70, 120, 0.18),
                    rgba(0, 30, 60, 0.25)
                ),
                url("/static/images/wind_farm_login.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }


        /* Dark transparent overlay */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 70, 120, 0.12),
                    rgba(0, 0, 0, 0.20)
                );

            z-index: 0;

        }


        /* Top-left branding */

        .brand {

            position: fixed;

            top: 28px;
            left: 45px;

            color: white;

            z-index: 2;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.35);

        }

        .brand-title {

            font-size: 28px;

            font-weight: 700;

            margin-bottom: 5px;

        }

        .brand-subtitle {

            font-size: 15px;

            letter-spacing: 1px;

        }


        /* Top-right text */

        .renewable {

            position: fixed;

            top: 32px;
            right: 45px;

            color: white;

            border-left: 3px solid #52e6b5;

            padding-left: 15px;

            font-size: 14px;

            line-height: 1.5;

            z-index: 2;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.35);

        }


        /* Login card */

        .login-card {

            position: relative;

            z-index: 2;

            width: 470px;

            padding: 42px 38px;

            border-radius: 22px;

            background:
                rgba(255, 255, 255, 0.92);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.28);

            border:
                1px solid rgba(255, 255, 255, 0.75);

        }


        /* User icon */

        .user-icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #d9f1ff,
                    #c6e9ff
                );

            display: flex;

            align-items: center;
            justify-content: center;

            color: #0878d1;

            font-size: 34px;

            box-shadow:
                0 5px 15px rgba(0, 100, 180, 0.12);

        }


        /* Project title */

        .project-title {

            text-align: center;

            color: #082567;

            font-size: 27px;

            font-weight: 700;

            line-height: 1.25;

            margin: 0;

        }


        .login-title {

            text-align: center;

            color: #64748b;

            font-size: 17px;

            margin-top: 10px;

            margin-bottom: 32px;

        }


        /* Form */

        label {

            display: block;

            color: #123c72;

            font-weight: 700;

            margin-bottom: 8px;

            font-size: 15px;

        }


        .input-container {

            position: relative;

            margin-bottom: 22px;

        }


        .input-icon {

            position: absolute;

            left: 16px;

            top: 50%;

            transform: translateY(-50%);

            color: #5578a5;

            font-size: 19px;

        }


        input {

            width: 100%;

            height: 55px;

            padding:
                0 18px 0 48px;

            border:
                1px solid #cbd9e8;

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.85);

            font-size: 15px;

            color: #17375e;

            outline: none;

            transition: 0.2s;

        }


        input:focus {

            border-color: #0788df;

            box-shadow:
                0 0 0 3px rgba(0, 136, 223, 0.12);

        }


        /* Login button */

        .login-button {

            width: 100%;

            height: 55px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #0878e8,
                    #0bb6df
                );

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 18px rgba(0, 125, 220, 0.25);

            transition: 0.2s;

        }


        .login-button:hover {

            transform: translateY(-1px);

            box-shadow:
                0 10px 25px rgba(0, 125, 220, 0.35);

        }


        /* Divider */

        .divider {

            display: flex;

            align-items: center;

            gap: 15px;

            margin: 28px 0 22px;

            color: #8a9bad;

            font-size: 14px;

        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #d9e1ea;

        }


        /* Back link */

        .back-link {

            display: block;

            text-align: center;

            color: #0878e8;

            font-weight: 700;

            text-decoration: none;

            font-size: 15px;

        }


        .back-link:hover {

            text-decoration: underline;

        }


        /* Mobile */

        @media (max-width: 700px) {

            .brand {

                top: 18px;
                left: 20px;

            }

            .brand-title {

                font-size: 20px;

            }

            .brand-subtitle {

                font-size: 12px;

            }

            .renewable {

                display: none;

            }

            .login-card {

                width: 90%;

                padding: 32px 25px;

                margin-top: 45px;

            }

            .project-title {

                font-size: 22px;

            }

        }

    </style>

</head>


<body>


    <!-- Top-left branding -->

    <div class="brand">

        <div class="brand-title">
            🌿 Smart Grid System
        </div>

        <div class="brand-subtitle">
            Clean Energy &nbsp;•&nbsp; Smarter Future
        </div>

    </div>


    <!-- Top-right branding -->

    <div class="renewable">

        Renewable Energy<br>

        for a Sustainable Tomorrow

    </div>


    <!-- Login card -->

    <div class="login-card">


        <div class="user-icon">
            👤
        </div>


        <h1 class="project-title">

            Smart Grid Energy Load<br>
            Balancing System using<br>
            Machine Learning

        </h1>


        <div class="login-title">

            Administrator Login

        </div>


        <form
            method="POST"
            action="/admin-login"
        >


            <label>
                Email
            </label>


            <div class="input-container">

                <span class="input-icon">
                    ✉
                </span>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <label>
                Password
            </label>


            <div class="input-container">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >

                ➜ &nbsp; Admin Login

            </button>


        </form>


        <div class="divider">
            OR
        </div>


        <a
            href="/login"
            class="back-link"
        >

            ← &nbsp; Back to User Login

        </a>


    </div>


</body>

</html>
