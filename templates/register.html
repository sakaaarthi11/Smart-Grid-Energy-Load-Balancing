<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Your Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            /* Same green energy background */
            background-image: url("/static/images/greenenergyimg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;
        }

        /* Soft overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background: rgba(0, 70, 55, 0.12);

            z-index: 0;
        }

        /* Register card */
        .register-card {
            position: relative;
            z-index: 2;

            width: 470px;
            max-width: 90%;

            padding: 45px 48px;

            background: rgba(235, 249, 248, 0.72);

            border: 2px solid rgba(255, 255, 255, 0.75);

            border-radius: 30px;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 25px 65px rgba(0, 50, 45, 0.30),
                inset 0 1px 1px rgba(255, 255, 255, 0.9);

            text-align: center;
        }

        /* Eco icon */
        .eco-icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 45px;

            background: rgba(255, 255, 255, 0.48);

            border-radius: 50%;

            box-shadow:
                0 8px 20px rgba(0, 70, 55, 0.12);
        }

        /* Heading */
        h1 {
            color: #07535b;

            font-size: 34px;
            font-weight: 700;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #25615e;

            font-size: 15px;

            margin-bottom: 28px;
        }

        /* Form */
        form {
            text-align: left;
        }

        label {
            display: block;

            color: #155e5d;

            font-size: 15px;
            font-weight: 600;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 14px 16px;

            margin-bottom: 18px;

            border: 1.5px solid rgba(7, 151, 111, 0.35);

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.85);

            color: #164f4c;

            font-size: 15px;

            outline: none;

            transition: 0.25s ease;
        }

        input:focus {
            border-color: #07976f;

            background: white;

            box-shadow:
                0 0 0 3px rgba(7, 151, 111, 0.12);
        }

        input::placeholder {
            color: #7a9b98;
        }

        /* Register button */
        .register-btn {
            width: 100%;

            padding: 15px;

            margin-top: 5px;

            border: none;

            border-radius: 30px;

            background: #079f82;

            color: white;

            font-size: 17px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 22px rgba(0, 70, 55, 0.20);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .register-btn:hover {
            background: #078c73;

            transform: translateY(-3px);

            box-shadow:
                0 13px 28px rgba(0, 60, 50, 0.25);
        }

        /* Back link */
        .back-home {
            display: inline-block;

            margin-top: 24px;

            color: #087d69;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;
        }

        .back-home:hover {
            color: #07535b;

            text-decoration: underline;
        }

        /* Mobile */
        @media (max-width: 500px) {

            .register-card {
                padding: 35px 25px;
            }

            h1 {
                font-size: 28px;
            }

            .eco-icon {
                width: 62px;
                height: 62px;
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <div class="register-card">

        <div class="eco-icon">
            🌿⚡
        </div>

        <h1>Create Your Account</h1>

        <div class="subtitle">
            Join the Smart Grid Energy Management System
        </div>

        <form method="POST">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button type="submit" class="register-btn">
                Register
            </button>

        </form>

        <a href="{{ url_for('home') }}" class="back-home">
            ← Back to Home
        </a>

    </div>

</body>
</html>
